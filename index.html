<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>副業タイプ診断「はじめの一歩」</title>
<meta name="description" content="「向いてる副業」より「明日やること」がわかる診断ツール。全16問・約3分、登録不要。8タイプ判定＋最初の7日間プランつき。">
<meta name="theme-color" content="#2F6BFF">
<!-- SNSシェア用（画像は用意でき次第 og:image を追加してください） -->
<meta property="og:type" content="website">
<meta property="og:title" content="副業タイプ診断「はじめの一歩」">
<meta property="og:description" content="「向いてる副業」より「明日やること」がわかる診断ツール。全16問・約3分、登録不要。8タイプ判定＋最初の7日間プランつき。">
<meta property="og:site_name" content="副業タイプ診断「はじめの一歩」">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="副業タイプ診断「はじめの一歩」">
<meta name="twitter:description" content="「向いてる副業」より「明日やること」がわかる診断ツール。全16問・約3分、登録不要。">
<style>
:root{
  --bg:#FAF9F7; --surface:#fff; --text:#1C2333; --sub:#5B6376; --border:#E4E1DB;
  --accent:#2F6BFF; --accent2:#FF8A3D; --soft:#F1F4FB;
  --radius:14px; --shadow:0 2px 12px rgba(28,35,51,.06);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14171F; --surface:#1D212B; --text:#EDF0F5; --sub:#A2AAB9; --border:#2E3440;
         --accent:#6E9BFF; --accent2:#FFA463; --soft:#232A38; --shadow:0 2px 12px rgba(0,0,0,.3); }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); line-height:1.75;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-font-smoothing:antialiased; padding:0 16px env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto;padding:24px 0 64px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* --- 共通ボタン --- */
.btn{display:block;width:100%;background:var(--accent);color:#fff;font-weight:700;font-size:17px;
  padding:16px;border-radius:var(--radius);text-align:center;transition:transform .12s,opacity .12s;
  box-shadow:0 6px 18px rgba(47,107,255,.22)}
.btn:active{transform:scale(.985);opacity:.9}
.btn .bs{display:block;font-size:12.5px;font-weight:600;opacity:.88;margin-top:4px;letter-spacing:.01em}
.btn.sub{background:var(--surface);color:var(--text);border:1px solid var(--border);
  font-size:15px;font-weight:600;padding:14px;box-shadow:none}
.resume{margin-top:10px}

/* --- LP --- */
.hero{padding:26px 0 0}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--accent);
  border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:800;letter-spacing:.02em}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hero h1{font-size:28px;font-weight:800;line-height:1.5;margin-top:15px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .name{margin-top:16px;font-size:12px;color:var(--sub);letter-spacing:.1em}
.hero .name b{display:block;font-size:18px;color:var(--text);letter-spacing:0;margin-top:1px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 0}
.pill{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--sub)}

/* 診断画面のミニプレビュー（＝ツールだと一目でわかる部分） */
.mock{margin:22px 0 8px;padding:17px;pointer-events:none}
.mock .mh{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-bottom:7px;font-weight:600}
.mock .mbar{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:15px}
.mock .mbar i{display:block;height:100%;width:31%;background:var(--accent);border-radius:99px}
.mock .mq{font-size:15.5px;font-weight:800;line-height:1.55;margin-bottom:11px}
.mock .mo{border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;
  font-size:13px;color:var(--sub);margin-bottom:7px;line-height:1.5}
.mock .mo:last-child{margin-bottom:0}
.mock .mo.on{border-color:var(--accent);background:var(--soft);color:var(--text);font-weight:700;position:relative}
.mock .mo.on::after{content:"タップ";position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:99px;padding:2px 8px}
.cap{text-align:center;font-size:12px;color:var(--sub);margin:8px 0 20px}

/* LPセクション見出し */
.lph{font-size:16.5px;font-weight:800;margin:36px 0 12px;display:flex;align-items:center;gap:8px}
.lph::before{content:"";width:4px;height:17px;background:var(--accent);border-radius:3px}
.lph.hot::before{background:var(--accent2)}

/* 3ステップ */
.steps{display:flex;flex-direction:column;gap:9px}
.step{display:flex;gap:13px;align-items:flex-start;padding:14px 16px}
.step .sn{flex:none;width:27px;height:27px;border-radius:9px;background:var(--accent);color:#fff;
  font-size:13px;font-weight:800;display:grid;place-items:center}
.step.hot .sn{background:var(--accent2)}
.step .st{font-size:15px;font-weight:800;line-height:1.5}
.step .sd{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.65}

/* 3軸ミニ図 */
.axmini{padding:13px 15px}
.axrow{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px dashed var(--border)}
.axrow:last-child{border-bottom:none}
.axrow span{flex:none;width:48px;color:var(--sub);font-size:11.5px;font-weight:700}
.axrow b{flex:1;text-align:center;background:var(--soft);border-radius:8px;padding:6px 2px;font-size:12.5px;font-weight:700}
.axrow i{flex:none;font-style:normal;color:var(--sub);font-size:13px}

/* 8タイプ（伏せた状態） */
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.tg div{aspect-ratio:1;display:grid;place-items:center;background:var(--soft);
  border:1px solid var(--border);border-radius:11px;font-size:19px;font-weight:800;color:var(--sub);opacity:.75}

/* 向いている人 */
.lp-note li{list-style:none;color:var(--text);font-size:14.5px;padding:11px 0 11px 26px;position:relative;
  border-bottom:1px solid var(--border);line-height:1.6}
.lp-note li:last-child{border-bottom:none}
.lp-note li::before{content:"✓";position:absolute;left:2px;top:11px;color:var(--accent);font-weight:800}

/* 追従CTA */
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--border);transform:translateY(130%);
  transition:transform .28s ease;z-index:8}
.sticky.on{transform:none}
.sticky .btn{max-width:608px;margin:0 auto;padding:14px;font-size:16px}
body.hassticky .wrap{padding-bottom:120px}

/* --- 設問 --- */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);padding:8px 0}
.back{padding:6px 10px;margin-left:-10px;border-radius:8px}
.back:disabled{opacity:.25;cursor:default}
.bar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:34px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.qtext{font-size:21px;font-weight:700;line-height:1.6;margin-bottom:24px;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;font-size:15.5px;font-weight:500;line-height:1.6;min-height:56px;transition:all .14s}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--soft)}
.opt.multi{padding-left:48px;position:relative}
.opt.multi::before{content:"";position:absolute;left:18px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;border:1.5px solid var(--border);border-radius:5px}
.opt.multi.on::before{background:var(--accent);border-color:var(--accent)}
.opt.multi.on::after{content:"";position:absolute;left:24px;top:calc(50% - 5px);width:5px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}

/* --- 中間 / 演出 --- */
.mid{padding:60px 0 0;text-align:center}
.mid h2{font-size:26px;font-weight:800;margin-bottom:14px}
.mid p{color:var(--sub);font-size:15px;margin-bottom:30px}
.loading{padding:130px 0;text-align:center;color:var(--sub);font-size:15.5px}
.spin{width:34px;height:34px;margin:0 auto 22px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- 結果 --- */
.rhead{text-align:center;padding:34px 0 30px}
.rhead .lead{font-size:14px;color:var(--sub);letter-spacing:.1em}
.rhead .tname{font-size:33px;font-weight:800;line-height:1.35;margin:10px 0 12px;letter-spacing:-.02em}
.rhead .tname span{color:var(--accent)}
.rhead .tcatch{font-size:16px;color:var(--sub);font-weight:600}
section{margin-top:30px}
h2.sec{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
h2.sec::before{content:"";width:4px;height:19px;background:var(--accent);border-radius:3px}
h2.sec.hot::before{background:var(--accent2)}
.axis{padding:16px 18px;margin-bottom:10px}
.axis .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:7px}
.axis .top b{color:var(--text);font-size:13px}
.track{position:relative;height:7px;background:var(--soft);border-radius:99px;border:1px solid var(--border)}
.track i{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:var(--accent);
  transform:translate(-50%,-50%);border:2.5px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.axis .val{margin-top:9px;font-size:13.5px;font-weight:700}
.tight{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent2);
  background:var(--soft);padding:2px 8px;border-radius:99px}
.about{padding:18px;font-size:15px}
.about p+p{margin-top:8px}
.job{padding:18px;margin-bottom:11px}
.job .t{font-size:16.5px;font-weight:800;margin-bottom:11px;display:flex;gap:9px;align-items:flex-start}
.job .t i{flex:none;width:23px;height:23px;border-radius:7px;background:var(--accent);color:#fff;font-style:normal;
  font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.job dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
.job dt{color:var(--sub);white-space:nowrap}
.job dd{font-weight:600}
.job .ai{margin-top:11px;padding-top:11px;border-top:1px dashed var(--border);font-size:13.5px;color:var(--sub)}
.job .ai b{color:var(--accent2)}
.job .warn{margin-top:9px;font-size:12.5px;color:var(--accent2);font-weight:600}
.plan{overflow:hidden}
.day{display:flex;gap:13px;padding:15px 17px;border-bottom:1px solid var(--border);align-items:flex-start}
.day:last-child{border-bottom:none}
.day .n{flex:none;width:46px;font-size:12px;font-weight:800;color:var(--accent2);padding-top:2px}
.day .b{flex:1;font-size:14.5px;line-height:1.65}
.day .m{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.day input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.day.done .b{opacity:.45;text-decoration:line-through}
.goal{margin-top:11px;padding:14px 17px;background:var(--soft);border-radius:var(--radius);font-size:14.5px;font-weight:700}
.goal span{color:var(--accent2)}
.tips{padding:6px 18px}
.tips li{list-style:none;padding:13px 0 13px 22px;border-bottom:1px solid var(--border);font-size:14.5px;position:relative}
.tips li:last-child{border-bottom:none}
.tips li::before{content:"!";position:absolute;left:0;top:13px;width:16px;height:16px;border-radius:50%;
  background:var(--accent2);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.tips.no li::before{content:"×";background:var(--sub)}
.tips li b{display:block;margin-bottom:2px}
.tips li em{font-style:normal;color:var(--sub);font-size:13.5px}
.alt{padding:18px;text-align:center}
.alt .k{font-size:13px;color:var(--sub)}
.alt .v{font-size:19px;font-weight:800;margin:6px 0 4px}
.alt .d{font-size:13.5px;color:var(--sub)}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.disc{margin-top:30px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:var(--sub);line-height:1.85}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:11px 22px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.toast.on{opacity:1}
@media print{
  body{background:#fff} .acts,.disc,.alt,.bar,.qhead{display:none}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   副業タイプ診断「はじめの一歩」 v1.0 (prototype)
   設計: 02_診断ロジック設計.md / 03_設問リスト.md / 04_結果コンテンツ_8タイプ.md
   ============================================================ */

/* ---------- 設問（Q1-Q12 判定用 / axis: 0=稼ぎ方 1=得意技 2=出し方） ---------- */
const QUESTIONS = [
{axis:0,text:'3ヶ月後、こうなっていたら嬉しい。',options:[
  ['毎月コンスタントに3万円の入金がある',2],
  ['少額でも「勝手に売れる仕組み」が1つできている',-2],
  ['金額は小さくていい。とにかく稼いだ実績がほしい',1],
  ['数字はまだでいい。記事や作品が10個たまっている',-1]]},
{axis:0,text:'週末に、まるまる5時間できたとしたら？',options:[
  ['案件を探して、片っ端から応募する',2],
  ['自分のコンテンツをひたすら作りためる',-2],
  ['すぐ終わる作業を、いくつか片付ける',1],
  ['半年後に効きそうな勉強や仕込みをする',-1]]},
{axis:0,text:'「その頑張り、3ヶ月ムダになるかも」と言われたら？',options:[
  ['それは困る。やった分の対価はほしい',2],
  ['当たれば大きいなら、試してみたい',-2],
  ['少しは我慢するけど、途中で手応えは見たい',1],
  ['別に気にならない。積み上げるのは好き',-1]]},
{axis:0,text:'報酬の受け取り方、どちらが好み？',options:[
  ['納品して、その分きっちり支払われる',2],
  ['何もしない月でも、数百円ずつ入ってくる',-2],
  ['締切があったほうが動ける',1],
  ['締切がないほうが気楽でいい',-1]]},
{axis:1,text:'気づいたら時間が溶けているのは？',options:[
  ['文章・画像・動画をいじっているとき',2],
  ['人の相談に乗っているとき',-2],
  ['情報を調べて、整理しているとき',1],
  ['誰かに何かを説明・紹介しているとき',-1]]},
{axis:1,text:'職場や身のまわりで、頼まれがちなのは？',options:[
  ['資料づくり・まとめ役',2],
  ['相談役・人の間に入る役',-2],
  ['細かいチェックや修正',1],
  ['新しく入った人の面倒を見る役',-1]]},
{axis:1,text:'5時間ぶっ通しでやるなら、どっちがラク？',options:[
  ['一人で黙々と手を動かす5時間',2],
  ['ずっと人と話している5時間',-2],
  ['基本は一人。でも時々質問できる環境',1],
  ['少人数と、ゆっくり話す',-1]]},
{axis:1,text:'「ありがとう」と言われて、一番うれしいのは？',options:[
  ['作ったものの出来をほめられたとき',2],
  ['「悩みが軽くなった」と言われたとき',-2],
  ['「早い」「正確」と言われたとき',1],
  ['「話してよかった」と言われたとき',-1]]},
{axis:2,text:'顔出し・実名について、正直なところ？',options:[
  ['全然OK。むしろ出していきたい',2],
  ['絶対に出したくない',-2],
  ['声だけ・イラストアイコンならOK',1],
  ['できれば伏せておきたい',-1]]},
{axis:2,text:'SNSで発信することについて。',options:[
  ['毎日投稿できる。反応がくるのが楽しみ',2],
  ['考えただけで気が重い',-2],
  ['内容によってはやれると思う',1],
  ['基本は見る専でいたい',-1]]},
{axis:2,text:'副業をしていることが、まわりに知られたら？',options:[
  ['特に問題ない。むしろ自分から言える',2],
  ['それは避けたい',-2],
  ['自分からは言わないけど、バレても平気',1],
  ['できれば知られたくない',-1]]},
{axis:2,text:'選ばれるなら、どっちがいい？',options:[
  ['「あなたにお願いしたい」と指名されたい',2],
  ['「品質と価格が合うから」で選ばれたい',-2],
  ['どちらかといえば、指名されたい',1],
  ['どちらかといえば、中身で選ばれたい',-1]]},
];

/* ---------- 条件設問（Q13-Q16 判定には使わない） ---------- */
const CONDITIONS = [
{key:'hours',text:'副業に使える時間は、週にどれくらい？',options:[
  ['週3時間以内（すきま時間だけ）',3],['週4〜7時間（1日1時間くらい）',7],
  ['週8〜14時間（平日＋週末）',14],['週15時間以上（がっつり取れる）',20]]},
{key:'goal',text:'まず目指したい金額は？',options:[
  ['月1〜3万円（お小遣いがほしい）','small'],['月5〜10万円（生活の足しにしたい）','mid'],
  ['月20万円以上（いずれ独立も視野に）','large'],['まだ決めていない','unknown']]},
{key:'budget',text:'最初にかけられる金額は？',options:[
  ['0円（今あるスマホ・PCだけで）',0],['1万円まで',10000],
  ['5万円まで',50000],['それ以上でも大丈夫',100000]]},
{key:'skills',multi:true,text:'いま持っている武器は？（あてはまるもの全部）',options:[
  ['文章を書くのが苦じゃない','writing'],['デザイン・画像編集ができる','design'],
  ['動画編集ができる','video'],['プログラミングができる','code'],
  ['話す・教えるのが得意','speak'],['仕事の専門知識がある','expertise'],
  ['特にない（そこも含めて知りたい）','none']]},
];

const AXES = [
  {name:'稼ぎ方',pos:'フロー型',neg:'ストック型',posHint:'すぐ換金',negHint:'積み上げ'},
  {name:'得意技',pos:'制作型',neg:'対人型',posHint:'モノを作る',negHint:'人に向き合う'},
  {name:'出し方',pos:'表に出る',neg:'裏方',posHint:'名前を出す',negHint:'匿名で'},
];

const GOAL_MSG = {
  small:'月1〜3万円なら、このタイプでも現実的に届きやすいラインです。まずはここを取りにいきましょう！',
  mid:'月5〜10万円を狙うなら、「単価を上げる」か「本数を増やす」か、どちらかの工夫が必要になります。',
  large:'月20万円以上を目指すなら、時間の切り売りだけでは届きにくいので、ストック側も併走させるのがおすすめです。',
  unknown:'金額が決まっていないうちは、まず「初めての1円」を取ることをゴールに置くと動きやすくなります。',
};

/* ---------- 8タイプ ---------- */

/* ============================ 状態 ============================ */
const KEY='fs_state_v1';
let S = {answers:[], cond:{}, step:-1};   // step: -1=LP, 0..11=Q, 12=中間, 13..16=条件, 99=結果
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._id); t._id=setTimeout(()=>t.classList.remove('on'),1900);
}

/* ============================ 診断ロジック ============================ */
function diagnose(){
  const axes=[0,0,0];
  QUESTIONS.forEach((q,i)=>{ const a=S.answers[i]; if(a!=null) axes[q.axis]+=q.options[a][1]; });
  return finalize(axes);
}
function finalize(axes){
  const code = (axes[0]>=0?'F':'S') + (axes[1]>=0?'M':'P') + (axes[2]>=0?'O':'U');
  const weak = axes.map((v,i)=>({i,abs:Math.abs(v)})).sort((a,b)=>a.abs-b.abs)[0];
  const flip = {F:'S',S:'F',M:'P',P:'M',O:'U',U:'O'};
  const alt = code.split('').map((c,i)=> i===weak.i ? flip[c] : c).join('');
  return {code, axes, altCode:alt, weakAxis:weak.i, tight:weak.abs<=2};
}
/* 条件による並び替え（skills一致 +10 / 初心者向け +15 / 予算オーバー -20） */
function rankJobs(jobs, cond){
  const skills = cond.skills||[], budget = cond.budget??100000;
  return jobs.map(j=>{
    let s=0;
    (j.tags||[]).forEach(t=>{ if(skills.includes(t)) s+=10; });
    if(skills.includes('none') && j.easy) s+=15;
    const over = (j.budget||0) > budget;
    if(over) s-=20;
    return {...j, _s:s, _over:over};
  }).sort((a,b)=>b._s-a._s);
}
/* 使える時間で7日間プランの分量を調整 */
function adjustPlan(plan, hours){
  const f = hours<=3 ? 0.5 : hours<=7 ? 1 : hours<=14 ? 1 : 1.3;
  return plan.map(([task,min])=>[task, Math.max(15, Math.round(min*f/5)*5)]);
}
function planNote(hours){
  if(hours<=3) return '週3時間以内とのことなので、1日あたりの分量を圧縮しています。7日で1周できない日があっても大丈夫、順番だけ守れば大丈夫です！';
  if(hours>=20) return '週15時間以上取れるなら、Day1〜3を初日にまとめて前倒しできます。短期集中で回していきましょう！';
  if(hours>=8) return '平日＋週末で回せるペースです。余裕がある日は次のDayを先取りしてもOK！';
  return '1日30〜60分を想定した標準ペースです。';
}

/* ============================ 画面 ============================ */
function render(){
  app.className='wrap fade'; app.scrollTop=0; window.scrollTo(0,0);
  // LP専用の追従CTAを毎回リセット
  document.getElementById('sticky')?.remove();
  document.body.classList.remove('hassticky');
  window.onscroll=null;
  if(S.step===-1) return renderLP();
  if(S.step>=0 && S.step<12) return renderQ(S.step);
  if(S.step===12) return renderMid();
  if(S.step>=13 && S.step<=16) return renderCond(S.step-13);
  if(S.step===98) return renderLoading();
  if(S.step===99) return renderResult(S.result || diagnose());
}

/* ============================ URL共有 ============================ */
function buildURL(R){
  const p=new URLSearchParams();
  p.set('t',R.code); p.set('a',R.axes.join('.'));
  if(S.cond.hours!=null) p.set('h',S.cond.hours);
  if(S.cond.goal) p.set('g',S.cond.goal);
  if(S.cond.budget!=null) p.set('b',S.cond.budget);
  if((S.cond.skills||[]).length) p.set('s',S.cond.skills.join('.'));
  return location.origin+location.pathname+'?'+p.toString();
}
function fromURL(){
  const p=new URLSearchParams(location.search);
  const t=p.get('t'), a=(p.get('a')||'').split('.').map(Number);
  if(!t || !TYPES[t] || a.length!==3 || a.some(n=>!Number.isFinite(n)||Math.abs(n)>8)) return false;
  S={answers:[],cond:{
      hours: p.get('h')!=null ? +p.get('h') : 7,
      goal:  p.get('g') || 'unknown',
      budget:p.get('b')!=null ? +p.get('b') : 100000,
      skills:(p.get('s')||'').split('.').filter(Boolean),
    },step:99};
  const R=finalize(a);
  S.result = (R.code===t) ? R : {...R, code:t};   // 念のためコードを優先
  return true;
}

/* ============================ 起動 ============================ */
if(!fromURL()){
  const saved=load();
  if(saved && saved.step===99 && saved.result) S=saved;   // 結果まで終わっていれば復元
}
render();
